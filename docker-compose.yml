services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@postgres:5432/taskflow
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker.main
    environment:
      DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@postgres:5432/taskflow
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/code
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dispatcher:
    build: .
    command: python -m app.dispatcher.main
    environment:
      DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@postgres:5432/taskflow
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/code
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  retry-scheduler:
    build: .
    command: python -m app.retry_scheduler.main
    environment:
      DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@postgres:5432/taskflow
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/code
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: